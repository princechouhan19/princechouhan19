<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Prince Chouhan - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .name { font-size: 54px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
      .tag  { font-size: 22px; fill: #c7d2fe; opacity: 0; }
      .cursor { fill: #22d3ee; animation: blink 1s steps(1) infinite; }
      .wave1 { animation: drift 10s linear infinite; }
      .wave2 { animation: drift 16s linear infinite reverse; }
      .t0 { animation: cycle 12s infinite 0s; }
      .t1 { animation: cycle 12s infinite 3s; }
      .t2 { animation: cycle 12s infinite 6s; }
      .t3 { animation: cycle 12s infinite 9s; }
      .name { animation: rise 1.2s ease-out both; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        4%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        26%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; }
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .wave1, .wave2, .cursor, .name, .t0, .t1, .t2, .t3 { animation: none; }
        .t0 { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="900" height="240" fill="url(#bg)"/>
  <g class="wave2">
    <path fill="url(#w2)" d="M0,185 Q112.5,150 225,185 T450,185 T675,185 T900,185 T1125,185 T1350,185 T1575,185 T1800,185 V240 H0 Z"/>
  </g>
  <g class="wave1">
    <path fill="url(#w1)" d="M0,205 Q112.5,175 225,205 T450,205 T675,205 T900,205 T1125,205 T1350,205 T1575,205 T1800,205 V240 H0 Z"/>
  </g>
  <text class="name" x="450" y="100" text-anchor="middle">Prince Chouhan</text>
  <g>
    <text class="tag t0" x="450" y="150" text-anchor="middle">Full-Stack Developer · UI/UX</text>
    <text class="tag t1" x="450" y="150" text-anchor="middle">Building EOS, a web agency</text>
    <text class="tag t2" x="450" y="150" text-anchor="middle">Learning DSA, Gen AI &amp; DevOps</text>
    <text class="tag t3" x="450" y="150" text-anchor="middle">Heading toward AI/ML engineering</text>
  </g>
</svg>
